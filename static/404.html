<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>페이지를 찾을 수 없습니다 | 커마</title>
		<link rel="icon" href="/logo.svg" />
		<style>
			:root {
				font-family: system-ui, sans-serif;
				color: #202632;
				background: #fff;
			}
			body {
				display: grid;
				place-content: center;
				min-height: 100dvh;
				margin: 0;
				padding: 0 24px;
				text-align: center;
			}
			img {
				margin: 0 auto;
			}
			h1 {
				margin: 24px 0 12px;
				font-size: 24px;
			}
			p {
				color: #737d8a;
				font-size: 14px;
				line-height: 1.7;
			}
			a {
				display: inline-block;
				margin-top: 16px;
				color: #4f46e5;
				font-size: 14px;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					background: #0a0b0c;
					color: #e8e8e8;
				}
				a {
					color: #fde047;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/logo.svg" alt="커마" width="48" height="48" />
			<h1>페이지를 찾을 수 없습니다.</h1>
			<p>주소를 확인하시거나 메인페이지에서 서비스를 찾아보세요.</p>
			<a href="/">커마 홈으로 돌아가기 →</a>
		</main>
	</body>
</html>
